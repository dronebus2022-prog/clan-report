<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>클랜 주간 성적 대시보드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #0b1329; color: #f8fafc; font-family: 'Pretendard', system-ui, -apple-system, sans-serif; }
        .glass-panel { background: rgba(22, 34, 64, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .table-input { background: #0f172a; border: 1px solid rgba(255, 255, 255, 0.15); color: #fff; }
        .table-input:focus { border-color: #3b82f6; outline: none; background: #1e293b; }
        .up-text { color: #f87171; font-weight: 600; font-size: 0.82rem; margin-left: 2px; }
        .down-text { color: #60a5fa; font-weight: 600; font-size: 0.82rem; margin-left: 2px; }
        .same-text { color: #94a3b8; font-size: 0.82rem; margin-left: 2px; }
        .new-text { color: #34d399; font-weight: 700; font-size: 0.82rem; margin-left: 2px; }
    </style>
</head>
<body class="min-h-screen p-3 md:p-6">
    <div class="max-w-6xl mx-auto space-y-5">
        
        <!-- 헤더 영역 -->
        <div class="glass-panel rounded-2xl p-5 flex flex-col sm:flex-row justify-between items-center gap-4 shadow-xl">
            <div>
                <h1 class="text-2xl md:text-3xl font-extrabold text-white flex items-center gap-2">
                    🏆 <span class="bg-gradient-to-r from-blue-400 to-indigo-300 bg-clip-text text-transparent">6시즌 2주차 등반 결과</span>
                </h1>
                <p class="text-slate-400 text-xs md:text-sm mt-1">전투력 기준 순위 · 전주 대비 성장 리포트</p>
            </div>
            <button onclick="toggleModal()" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-sm font-bold transition flex items-center gap-2 shadow-lg shadow-blue-600/30">
                <i class="fa-solid fa-pen-to-square"></i> 내 성적 입력하기
            </button>
        </div>

        <!-- 이번 주 클랜 평균 성장량 요약 카드 -->
        <div class="glass-panel rounded-2xl p-4 md:p-5 border-l-4 border-emerald-400">
            <h3 class="text-xs md:text-sm font-bold text-emerald-400 mb-3 flex items-center gap-2">
                <i class="fa-solid fa-chart-line"></i> 이번 주 클랜 평균 성장량
            </h3>
            <div id="average-summary-grid" class="grid grid-cols-2 sm:grid-cols-5 gap-3 text-center">
                <!-- JavaScript 동적 계산 렌더링 -->
            </div>
        </div>

        <!-- 등반 순위표 -->
        <div class="glass-panel rounded-2xl overflow-hidden shadow-2xl">
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm whitespace-nowrap">
                    <thead class="bg-blue-600 text-white font-semibold">
                        <tr>
                            <th class="py-3 px-3 text-center w-14">순위</th>
                            <th class="py-3 px-3 text-center w-14">변동</th>
                            <th class="py-3 px-4">닉네임</th>
                            <th class="py-3 px-4 text-right">전투력</th>
